<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stonk City — Game Pup</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11152c;color:white;font:700 16px system-ui;overflow:hidden;touch-action:none}
#game{width:100vw;height:100dvh;display:block}
#screen{position:absolute;inset:0;display:grid;place-items:center;padding:15px;background:#10152beF}
.card{width:min(560px,100%);max-height:96dvh;overflow:auto;text-align:center;background:#202744;border:2px solid #78f5ba;border-radius:20px;padding:20px;box-shadow:0 12px #090d1c}
h1{font-size:clamp(38px,10vw,70px);line-height:.9;color:#ffe36b;text-shadow:4px 4px #e74f88;margin:14px 0}
p{font-weight:500;line-height:1.4;color:#d9e7f0}
button{font:inherit;cursor:pointer}
.big,.hero{background:#80efb9;border:2px solid #adffda;border-radius:12px;padding:13px 18px;margin:6px;color:#112433}
.hero{width:30%;min-height:128px;background:#354369;color:white;padding:8px}
.hero.selected{background:#744884;border-color:#ffe36b}
.hero b{display:block;font-size:39px}
.hero small{display:block;font-size:11px;color:#d2def0}
video{width:100%;max-height:46dvh;background:black;border-radius:12px}
#hud{position:absolute;top:10px;left:12px;right:12px;display:none;justify-content:space-between;gap:8px;text-shadow:2px 2px #111;font-size:clamp(12px,3vw,17px);pointer-events:none}
#controls{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
.group{display:flex;gap:8px;pointer-events:auto}
.control{width:64px;height:64px;border-radius:50%;border:2px solid #a4ffe0;background:#253659df;color:white;font-size:20px;touch-action:none}
.attack{background:#e64a7b;font-size:13px}
.jump{background:#6561d7;font-size:13px}
@media(max-width:390px){.control{width:57px;height:57px}.card{padding:12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="health"></span><span id="score"></span></div>
<div id="controls">
  <div class="group">
    <button class="control" data-key="left">◀</button>
    <button class="control" data-key="right">▶</button>
  </div>
  <div class="group">
    <button class="control jump" data-key="jump">JUMP</button>
    <button class="control attack" data-key="attack">SMASH</button>
  </div>
</div>
<div id="screen"><div class="card" id="card"></div></div>

<script>
(() => {
  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d");
  const screen = document.querySelector("#screen");
  const card = document.querySelector("#card");
  const hud = document.querySelector("#hud");
  const controls = document.querySelector("#controls");
  const health = document.querySelector("#health");
  const scoreLabel = document.querySelector("#score");

  const heroes = [
    {name:"Keith Gill", icon:"🐱", color:"#ee575e", note:"Fast combo fighter"},
    {name:"Ryan Cohen", icon:"♟️", color:"#68c7ff", note:"Steady city fighter"},
    {name:"Tylee the GME Pup", icon:"🐶", color:"#edaa55", note:"Powerful pup smash"}
  ];

  let W, H, selected = 0, state = "menu", player, enemies = [];
  let sparks = [], labels = [], camera = 0, world = 3100;
  let points = 0, wave = 0, frame = 0, last = 0;
  const keys = {left:false,right:false,jump:false,attack:false};

  function resize() {
    const scale = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    ctx.setTransform(scale,0,0,scale,0,0);
  }
  addEventListener("resize", resize);
  resize();

  function floor() { return H - Math.max(100, Math.min(155, H * .24)); }
  function box(x,y,w,h,color) {
    ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
  }
  function menu(html) {
    screen.style.display="grid";
    hud.style.display="none";
    controls.style.display="none";
    card.innerHTML=html;
  }

  function intro() {
    state="menu";
    menu(`
      <small>GAME PUP PRESENTS</small>
      <h1>STONK CITY</h1>
      <p>Three heroes. One city. A whole lot of cartoon short sellers.</p>
      <button id="watch" class="big">WATCH INTRO & PLAY ▶</button>
      <button id="skip" class="big">SKIP VIDEO</button>
    `);
    document.querySelector("#watch").onclick=watch;
    document.querySelector("#skip").onclick=select;
  }

  function watch() {
    state="video";
    menu(`
      <h2>THE CITY NEEDS A HERO</h2>
      <video id="movie" src="telegram_video.mp4" controls autoplay playsinline></video>
      <p id="videoHelp">Your opening video plays here.</p>
      <button id="continue" class="big">CONTINUE →</button>
    `);
    const movie=document.querySelector("#movie");
    movie.onended=select;
    movie.onerror=()=>{
      document.querySelector("#videoHelp").textContent=
        "Video not found. Upload telegram_video.mp4 beside stonk-city.html.";
    };
    movie.play().catch(()=>{});
    document.querySelector("#continue").onclick=select;
  }

  function select() {
    state="select";
    menu(`
      <small>CHOOSE YOUR FIGHTER</small>
      <h1>STONK CITY</h1>
      <div>${heroes.map((h,i)=>`
        <button class="hero ${selected===i?"selected":""}" data-hero="${i}">
          <b>${h.icon}</b>${h.name}<small>${h.note}</small>
        </button>`).join("")}</div>
      <p>Run through the city, smash jeets and short sellers, and reach the exchange. Every knockout gets STONKED!</p>
      <button id="start" class="big">START FIGHTING →</button>
      <p><small>Phone: buttons below. Keyboard: A/D or arrows, Space to jump, J or K to smash.</small></p>
    `);
    document.querySelectorAll("[data-hero]").forEach(b=>{
      b.onclick=()=>{selected=Number(b.dataset.hero);select();};
    });
    document.querySelector("#start").onclick=start;
  }

  function enemy(x) {
    return {
      x, y:floor(), hp: selected===2?2:1,
      speed:.75+Math.random()*.65+wave*.14,
      kind:Math.random()<.5?"JEET":"SHORT",
      stunned:0, dead:false
    };
  }

  function start() {
    state="play"; wave=0; points=0; camera=0; frame=0; world=3100;
    player={x:90,y:floor(),vy:0,hp:6,dir:1,inv:0,cool:0,smash:0};
    enemies=Array.from({length:8},(_,i)=>enemy(450+i*300));
    sparks=[]; labels=[];
    screen.style.display="none";
    hud.style.display="flex";
    controls.style.display="flex";
  }

  function burst(x,y,color,count) {
    for(let i=0;i<count;i++) sparks.push({
      x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*6,
      life:15+Math.random()*18,color
    });
  }

  function stonk(e) {
    e.hp--;
    e.stunned=15;
    burst(e.x,e.y-35,"#ffe66d",12);
    if(e.hp<=0) {
      e.dead=true;
      points+=100;
      labels.push({x:e.x,y:e.y-85,life:75,text:"STONKED!",color:"#ffe66d"});
      burst(e.x,e.y-40,"#79f6bc",18);
    } else {
      labels.push({x:e.x,y:e.y-80,life:30,text:"POW!",color:"#ffffff"});
    }
  }

  function end(won) {
    state="end";
    menu(`
      <h1>${won?"CITY STONKED!":"TRY AGAIN!"}</h1>
      <p>${heroes[selected].name} scored <strong>${points}</strong> points.</p>
      <button id="again" class="big">PLAY AGAIN</button>
      <button id="change" class="big">CHANGE FIGHTER</button>
    `);
    document.querySelector("#again").onclick=start;
    document.querySelector("#change").onclick=select;
  }

  function update(dt) {
    const ground=floor();
    frame+=dt;

    if(keys.left) {player.x-=4.5*dt;player.dir=-1;}
    if(keys.right){player.x+=4.5*dt;player.dir=1;}
    player.x=Math.max(20,Math.min(world-25,player.x));

    if(keys.jump && player.y>=ground-1) {
      player.vy=-13;
      player.y--;
    }
    player.vy+=.6*dt;
    player.y=Math.min(ground,player.y+player.vy*dt);
    if(player.y>=ground)player.vy=0;

    player.inv=Math.max(0,player.inv-dt);
    player.cool=Math.max(0,player.cool-dt);
    player.smash=Math.max(0,player.smash-dt);

    if(keys.attack && player.cool<=0) {
      player.cool=23;
      player.smash=11;
      burst(player.x+player.dir*35,player.y-40,"#88ffe1",7);
      for(const e of enemies) {
        if(!e.dead && !e.stunned &&
           Math.abs(e.x-(player.x+player.dir*44))<65 &&
           Math.abs(e.y-player.y)<65) stonk(e);
      }
    }

    for(const e of enemies) {
      if(e.dead)continue;
      e.y=ground;
      e.stunned=Math.max(0,e.stunned-dt);
      if(!e.stunned && Math.abs(e.x-player.x)<440) {
        e.x+=Math.sign(player.x-e.x)*e.speed*dt;
      }
      if(!e.stunned && player.inv<=0 &&
         Math.abs(e.x-player.x)<32 && player.y>ground-55) {
        player.hp--;
        player.inv=65;
        player.vy=-5;
        burst(player.x,player.y-35,"#ff5c87",14);
        labels.push({x:player.x,y:player.y-90,life:36,text:"OUCH!",color:"#ff688e"});
        if(player.hp<=0){end(false);return;}
      }
    }
    enemies=enemies.filter(e=>!e.dead);

    if(player.x>world-550 && wave<3) {
      wave++;
      world+=700;
      for(let i=0;i<5+wave;i++)enemies.push(enemy(world-510+i*95));
      labels.push({x:player.x+80,y:ground-165,life:80,text:"WAVE "+(wave+1),color:"#8fffd3"});
    }
    if(wave===3 && enemies.length===0 && player.x>=world-150) {
      end(true);return;
    }

    camera=Math.max(0,Math.min(world-W,player.x-W*.35));
    for(const p of sparks) {
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.25*dt;p.life-=dt;
    }
    sparks=sparks.filter(p=>p.life>0);
    for(const p of labels){p.y-=.7*dt;p.life-=dt;}
    labels=labels.filter(p=>p.life>0);

    health.textContent="❤️ ".repeat(player.hp)+heroes[selected].name;
    scoreLabel.textContent="SCORE "+points+" • WAVE "+(wave+1)+"/4";
  }

  function draw() {
    const ground=floor();
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#171731");
    sky.addColorStop(.75,"#40365f");
    sky.addColorStop(1,"#ae5c78");
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#f7dba8";
    ctx.beginPath();ctx.arc(W*.78,90,35,0,Math.PI*2);ctx.fill();

    for(let layer=0;layer<2;layer++) {
      const bw=layer?90:135, shift=camera*(layer?.6:.25);
      for(let i=-2;i<W/bw+4;i++) {
        const x=i*bw-(shift%bw);
        const height=(layer?120:190)+((i*37+79)%85);
        box(x,ground-height,bw-5,height,layer?"#242940":"#292843");
        for(let y=ground-height+20;y<ground-15;y+=27)
          for(let wx=x+15;wx<x+bw-10;wx+=22)
            if((wx+y+i)%3<2)box(wx,y,8,12,layer?"#daa981":"#827a91");
      }
    }

    box(0,ground,W,H-ground,"#282b44");
    box(0,ground+8,W,10,"#6a5575");
    box(0,ground+53,W,7,"#171d31");
    for(let i=0;i<W/110+2;i++)
      box(i*110-camera%110,ground+89,54,3,"#ba9d88");

    for(let i=0;i<world/310;i++) {
      const x=i*310-camera;
      if(x<-90||x>W+90)continue;
      box(x,ground-95,8,95,"#171d31");
      box(x-18,ground-100,45,7,"#8cf7d1");
      box(x-12,ground-93,31,29,"#23394c");
      ctx.fillStyle="#ffdf78";
      ctx.font="bold 10px system-ui";
      ctx.fillText(i%2?"BUY":"HOLD",x-9,ground-75);
    }

    const exchange=world-105-camera;
    box(exchange-60,ground-235,150,78,"#24354a");
    ctx.strokeStyle="#ffe478";ctx.lineWidth=4;
    ctx.strokeRect(exchange-60,ground-235,150,78);
    ctx.fillStyle="#ffe478";ctx.font="bold 18px system-ui";
    ctx.fillText("EXCHANGE",exchange-48,ground-190);

    for(const e of enemies) {
      const x=e.x-camera;
      if(x<-80||x>W+80)continue;
      ctx.save();ctx.translate(x,e.y);
      if(e.stunned)ctx.globalAlpha=.55;
      box(-15,-53,30,38,e.kind==="JEET"?"#ce5aa1":"#687e96");
      box(-12,-17,10,17,"#171c30");box(4,-17,10,17,"#171c30");
      ctx.fillStyle="#efbc99";
      ctx.beginPath();ctx.arc(0,-64,15,0,Math.PI*2);ctx.fill();
      box(-18,-78,36,8,"#192136");
      ctx.fillStyle="white";ctx.textAlign="center";
      ctx.font="bold 11px system-ui";
      ctx.fillText(e.kind,0,-88);
      ctx.restore();
    }

    if(player) {
      const x=player.x-camera,y=player.y;
      ctx.save();ctx.translate(x,y);
      if(player.inv && Math.floor(frame/5)%2)ctx.globalAlpha=.4;
      if(selected===2) {
        ctx.fillStyle="#cb8943";
        ctx.beginPath();ctx.ellipse(0,-37,28,23,0,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(6,-63,23,0,7);ctx.fill();
        ctx.fillStyle="#9b612b";
        ctx.beginPath();
        ctx.ellipse(-14,-74,10,20,-.5,0,7);
        ctx.ellipse(22,-74,10,20,.5,0,7);ctx.fill();
        ctx.fillStyle="#1c1b28";
        ctx.beginPath();ctx.arc(14,-65,3,0,7);ctx.fill();
        box(-19,-23,12,22,"#a97838");
        box(11,-23,12,22,"#a97838");
        box(-17,-47,36,8,"#ea5571");
      } else {
        const color=heroes[selected].color;
        box(-19,-49,38,46,color);
        box(-16,-4,12,15,"#182239");
        box(5,-4,12,15,"#182239");
        box(-29,-47,10,27,color);
        box(19,-47,10,27,color);
        ctx.fillStyle="#edbd9c";
        ctx.beginPath();ctx.arc(0,-65,19,0,7);ctx.fill();
        box(-20,-83,40,12,selected===0?"#da435b":"#2a4269");
      }
      if(player.smash) {
        ctx.strokeStyle="#ffe577";ctx.lineWidth=7;
        ctx.beginPath();
        ctx.arc(player.dir*30,-41,32,-1.1,1.1);ctx.stroke();
      }
      ctx.restore();
    }

    ctx.textAlign="center";
    ctx.font="bold 23px system-ui";
    for(const p of labels) {
      ctx.globalAlpha=Math.min(1,p.life/18);
      ctx.fillStyle="#131629";
      ctx.fillText(p.text,p.x-camera+3,p.y+3);
      ctx.fillStyle=p.color;
      ctx.fillText(p.text,p.x-camera,p.y);
    }
    for(const p of sparks) {
      ctx.globalAlpha=Math.min(1,p.life/15);
      box(p.x-camera,p.y,5,5,p.color);
    }
    ctx.globalAlpha=1;

    if(state==="play" && wave===3 && enemies.length===0) {
      ctx.fillStyle="#ffe577";ctx.font="bold 18px system-ui";
      ctx.fillText("RUN TO THE EXCHANGE →",W/2,78);
    }
  }

  function loop(time) {
    const dt=Math.min(2,(time-last)/16.667||1);
    last=time;
    if(state==="play")update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.querySelectorAll(".control").forEach(button=>{
    const key=button.dataset.key;
    button.addEventListener("pointerdown",e=>{
      e.preventDefault();
      button.setPointerCapture(e.pointerId);
      keys[key]=true;
    });
    for(const event of ["pointerup","pointercancel","lostpointercapture"])
      button.addEventListener(event,()=>keys[key]=false);
  });

  const mapping={
    ArrowLeft:"left",KeyA:"left",
    ArrowRight:"right",KeyD:"right",
    ArrowUp:"jump",KeyW:"jump",Space:"jump",
    KeyJ:"attack",KeyK:"attack"
  };
  addEventListener("keydown",e=>{
    const key=mapping[e.code];
    if(key){e.preventDefault();keys[key]=true;}
  });
  addEventListener("keyup",e=>{
    const key=mapping[e.code];
    if(key){e.preventDefault();keys[key]=false;}
  });
  addEventListener("blur",()=>{
    for(const key of Object.keys(keys))keys[key]=false;
  });

  intro();
})();
</script>
</body>
</html>
